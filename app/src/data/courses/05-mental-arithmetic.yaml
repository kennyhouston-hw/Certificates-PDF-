# Порядок курсов в списке задаёт числовой префикс в имени файла.
# Уровни — id из src/data/levels.yaml. Названия уровней и подписи к ним берутся оттуда.
# Название курса на сертификате своё для каждого уровня (courseTitle).
# EN-темы продвинутого уровня в макете были на русском — переведены, проверьте.

id: mental-arithmetic
