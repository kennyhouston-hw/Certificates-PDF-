# Порядок курсов в списке задаёт числовой префикс в имени файла.
# Уровни — id из src/data/levels.yaml. Названия уровней и подписи к ним берутся оттуда.

id: scratch
title:
  ru: "Программирование на\_языке Scratch"
  en: Scratch programming language
levels:
  - id: preliminary
    skills:
      ru:
        - "координаты в\_2D-плоскости"
        - перемещения игровых объектов
        - "управление с\_помощью мыши и\_клавиатуры"
        - использование переменных
      en:
        - coordinates on 2D plane
        - movement of game objects
        - mouse and keyboard control
        - using variables
  - id: beginner
    skills:
      ru:
        - "алгоритм и\_параллельное выполнение"
        - "циклы, условия и\_события"
        - "спрайты и\_клоны"
        - переменные
        - функции
      en:
        - algorithm and parallel execution
        - loops, conditions, and events
        - sprites and clones
        - variables
        - functions
  - id: basic
    skills:
      ru:
        - "сложные условия и\_циклы"
        - "функции с\_аргументами"
        - "модуль для\_рисования"
        - "преобразование текста в\_речь"
        - использование списков
      en:
        - complex conditions and loops
        - functions with arguments
        - pen module
        - text-to-speech conversion
        - using lists
  - id: intermediate
    skills:
      ru:
        - "режим на\_одного/двух игроков"
        - "создание эффекта 3D на\_плоскости"
        - сложные игровое анимации
        - особенности звукового сопровождения
      en:
        - single-player and two-player modes
        - "creating 3D effect on a\_2D plane"
        - complex game animations
        - features of sound design
  - id: advanced
    skills:
      ru:
        - "машинное обучение с\_использованием веб-камеры"
        - "особенности локальных и\_глобальных переменных"
        - "работа с\_видео и\_отслеживание движения"
        - определение положения элементов лица
        - создание игровых профилей
      en:
        - "machine learning using a\_webcam"
        - features of local and global variables
        - working with video and motion tracking
        - face element position detection
        - creating game profiles
