# Порядок курсов в списке задаёт числовой префикс в имени файла.
# Уровни — id из src/data/levels.yaml. Названия уровней и подписи к ним берутся оттуда.

id: roblox
title:
  ru: "Разработка 3D-игр в\_ROBLOX"
  en: Creating 3D games in Roblox
levels:
  - id: preliminary
    skills:
      ru:
        - "основы работы в\_программе Roblox Studio"
        - "работа со\_свойствами объектов"
        - "знакомство с\_основами скриптов в\_Roblox Studio"
        - базовые приёмы построения игровых уровней
      en:
        - basics of working with Roblox Studio
        - manipulating object properties
        - introduction to scripting fundamentals in Roblox Studio
        - basic techniques for building game levels
  - id: beginner
    skills:
      ru:
        - "свойства расположения объектов в\_3D-пространстве"
        - "основы написания кода на\_языке Lua"
        - "базовые команды для\_перемещения игровых элементов"
        - "создание и\_использование переменных и\_условий"
        - "создание простейших игр в\_Roblox"
      en:
        - properties of object positioning in 3D space
        - fundamentals of coding in Lua
        - basic commands for moving game elements
        - creating and using variables and conditional statements
        - developing simple games in Roblox
  - id: basic
    skills:
      ru:
        - "работа с\_массивами"
        - создание игрового магазина
        - создание анимаций
        - "создание и\_использование диалогов"
        - использование Surface GUI
      en:
        - working with arrays
        - "creating an\_in-game store"
        - creating animations
        - creating and using dialogues
        - using Surface GUI
  - id: intermediate
    skills:
      ru:
        - использование поиска пути
        - создание музыкального плеера
        - "работа с\_сохранением данных в\_игре"
        - "работа с\_Attributes"
        - "работа с\_событиями"
      en:
        - implementing pathfinding
        - "creating a\_music player"
        - handling in-game data saving
        - working with Attributes
        - working with events
  - id: advanced
    skills:
      ru:
        - создание мультиплеерных игр
        - "работа с\_форматом json"
        - создание системы телепортации
        - "работа с\_RemoteEvent"
        - "создание и\_использование Coroutine"
      en:
        - developing multiplayer games
        - working with JSON format
        - "creating a\_teleportation system"
        - working with RemoteEvent
        - creating and using Coroutines
