# Порядок курсов в списке задаёт числовой префикс в имени файла.
# Уровни — id из src/data/levels.yaml. Названия уровней и подписи к ним берутся оттуда.

id: speed-reading-14
template: competencies
title:
  ru: "Скорочтение: интенсив для\_14+\_лет"
  en: "Speed Reading Course: Intensive for Ages 14+"
levels:
  - id: beginner
    skills:
      ru:
        - "Деактивация субвокализации: навык скоростного чтения «глазами» без\_внутреннего проговаривания текста."
        - "Стабилизация визуальной фиксации: ликвидация регрессий и\_оптимизация движения глаз по\_текстовому полотну."
        - "Смысловая антиципация: развитие навыка высокоскоростной догадки на\_уровне словосочетаний и\_законченных мыслей."
        - "Периферическая развёртка: расширение пятна чёткого фокуса для\_захвата целой строки за\_один взгляд."
        - "Концентрация и\_вход в\_«Поток»: навык мгновенного погружения в\_сложный текст без\_потери внимания."
      en:
        - "Deactivating Subvocalization: The\_skill of speed reading \"with the\_eyes\" without internally pronouncing the\_text."
        - "Stabilizing Visual Fixation: Eliminating regressions and optimizing eye movement across the\_text."
        - "Semantic Anticipation: Developing the\_skill of high-speed guessing at the\_level of phrases and complete thoughts."
        - "Peripheral Vision Expansion: Widening the\_clear focus spot to capture an\_entire line in a\_single glance."
        - "Concentration and Entering the\_\"Flow\": The\_skill of instantly immersing oneself in complex text without losing focus."
  - id: basic
    skills:
      ru:
        - "Вертикальное сканирование: переход от\_построчного чтения к\_диагональному и\_вертикальному движению по\_центру страницы."
        - "Алгоритм интегрального чтения: овладение системой фильтрации данных\_— отделение «зёрен» смысла от\_избыточного текста."
        - "Когнитивное моделирование: профессиональное использование интеллект-карт для\_эффективного сжатия и\_обработки больших объёмов данных."
        - "Интенсификация обработки: кратное увеличение скорости чтения при\_сохранении высокого коэффициента усвоения (70–90%)."
        - "Селективное извлечение: навык точечного поиска ключевых узлов и\_смысловых акцентов в\_тексте любой сложности."
      en:
        - "Vertical Scanning: Transitioning from line-by-line reading to diagonal and vertical movement down the\_center of the\_page."
        - "Integral Reading Algorithm: Mastering a\_data filtering system\_— separating the\_core meaning from redundant text."
        - "Cognitive Modeling: Professional use of mind maps for effectively compressing and processing large amounts of data."
        - "Processing Intensification: A\_multiple-fold increase in reading speed while maintaining a\_high retention rate (70–90%)."
        - "Selective Extraction: The\_skill of precisely locating key points and semantic emphases in texts of any complexity."
  - id: intermediate
    skills:
      ru:
        - "Интеллектуальное доминирование: достижение скорости чтения, в\_5–8\_раз превышающей средние показатели взрослого человека."
        - "Фотографическое восприятие: навык фиксации и\_осознания целых абзацев за\_минимальное количество микродвижений глаз."
        - "Системный аналитический синтез: умение мгновенно выстраивать иерархию смыслов и\_запоминать архитектуру сверхбольших текстов."
        - "Академическая выносливость: способность продуктивно работать с\_научной и\_технической литературой без\_утомления."
        - "Информационный суверенитет: сформированная привычка эффективного самообразования и\_управления личными знаниями."
      en:
        - "Intellectual Dominance: Achieving a\_reading speed 5–8\_times higher than the\_average adult's."
        - "Photographic Perception: The\_skill of perceiving and comprehending entire paragraphs in a\_minimal number of micro eye movements."
        - "Systemic Analytical Synthesis: The\_ability to instantly build a\_hierarchy of meanings and memorize the\_architecture of very large texts."
        - "Academic Endurance: The\_ability to productively work with scientific and technical literature without fatigue."
        - "Information Sovereignty: A\_formed habit of effective self-education and personal knowledge management."
