# Порядок курсов в списке задаёт числовой префикс в имени файла.
# Уровни — id из src/data/levels.yaml. Названия уровней и подписи к ним берутся оттуда.
# В макете RU-темы C++ скопированы из курса Unity (C#, интерфейс Unity...).
# Здесь RU-темы — перевод английской версии, проверьте.

id: cpp
title:
  ru: "Программирование на\_языке C++"
  en: C++ programming language
levels:
  - id: beginner
    skills:
      ru:
        - "переменные, массивы и\_типы данных"
        - "циклы и\_условные операторы"
        - "работа с\_файлами"
        - функции (подпрограммы)
        - "работа с\_памятью компьютера"
        - "основы ООП: классы, объекты, методы"
      en:
        - variables, arrays, and data types
        - loops and conditional statements
        - file handling
        - functions (subroutines)
        - working with computer memory
        - "basics of OOP: classes, objects, member functions"
  - id: basic
    skills:
      ru:
        - общие принципы создания графических приложений
        - "работа с\_графической библиотекой SFML"
        - "проектирование и\_реализация собственных классов"
        - принципы создания анимации
        - "перемещение и\_позиционирование игровых объектов"
        - организация файловой структуры проекта
      en:
        - general principles of creating graphical applications
        - "working with the\_SFML graphics library"
        - designing and implementing custom classes
        - principles of animation creation
        - movement and positioning of game objects
        - "organizing the\_file structure of the\_project"
  - id: intermediate
    skills:
      ru:
        - алгоритмы поиска
        - алгоритмы сортировки
        - жадные алгоритмы
        - "системы счисления и\_перевод чисел"
        - оценка эффективности алгоритмов
        - визуализация алгоритмов сортировки
      en:
        - search algorithms
        - sorting algorithms
        - greedy algorithms
        - number systems and number conversion
        - algorithm efficiency evaluation
        - visual representation of sorting algorithms
