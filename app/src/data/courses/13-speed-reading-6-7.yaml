# Порядок курсов в списке задаёт числовой префикс в имени файла.
# Уровни — id из src/data/levels.yaml. Названия уровней и подписи к ним берутся оттуда.

id: speed-reading-6-7
template: competencies
title:
  ru: Скорочтение для детей 6–7 лет
  en: Speed Reading Course for Children Ages 6–7
levels:
  - id: beginner
    skills:
      ru:
        - "Техника «Плавное скольжение»: переход от прерывистого (рубленого) чтения к слитному произношению слов."
        - "Навык «Зоркий глаз»: повышение концентрации внимания; умение видеть слово целиком и не терять строчку при чтении."
        - "Смысловое единство: способность связывать прочитанные слова в законченную мысль и понимать сюжет с первого прочтения."
        - "Фонетическая чистота: развитие чёткой артикуляции и правильного речевого дыхания для лёгкого чтения вслух."
        - "Образное мышление: умение представлять прочитанное в виде ярких картинок (первый шаг к пересказу без зубрёжки)."
      en:
        - "Smooth Gliding Technique: Transitioning from choppy, disjointed reading to fluid word pronunciation."
        - "Sharp Eye Skill: Improved concentration; the ability to recognize whole words and maintain one's place in the text while reading."
        - "Semantic Unity: The ability to connect words into a complete thought and understand the storyline on the first reading."
        - "Phonetic Clarity: Developing precise articulation and proper speech breathing for effortless reading aloud."
        - "Visual Thinking: The ability to visualize the text as vivid mental images (the first step toward retelling without rote memorization)."
  - id: basic
    skills:
      ru:
        - "Мгновенное узнавание: переход от послогового чтения к целостному восприятию слов (чтение «взглядом», а не по частям)."
        - "Стабильный темп: увеличение скорости чтения в 1.5–2 раза при сохранении 100% плавности и чистоты произношения."
        - "Оперативная память: способность удерживать в уме начало предложения до момента его завершения (устранение проблемы «прочитал и забыл»)."
        - "Расширение поля зрения: тренировка периферического зрения; умение видеть слово целиком и предугадывать следующее (антиципация)."
        - "Образная детализация: развитие навыка «внутреннего экрана» — умение ярко представлять детали прочитанного для лёгкого пересказа."
      en:
        - "Instant Word Recognition: Transitioning from syllable-by-syllable decoding to whole-word perception (reading at a glance rather than piece by piece)."
        - "Steady Reading Pace: Increasing reading speed by 1.5–2 times while maintaining 100% fluency and clarity of pronunciation."
        - 'Working Memory: The ability to retain the beginning of a sentence in mind until it is finished (eliminating the "read and immediately forget" issue).'
        - "Expanded Visual Span: Training peripheral vision; the ability to see whole words and anticipate the next one (anticipation skill)."
        - 'Visual Detailing: Developing the "inner screen" — the ability to vividly picture details from the text for effortless retelling.'
  - id: intermediate
    skills:
      ru:
        - "Смысловое проектирование: умение выделять главную мысль в абзаце и связывать части текста в единую логическую цепочку."
        - "Глубинная обработка: навык «вдумчивого чтения» — способность отвечать на сложные вопросы по тексту без повторного перечитывания."
        - "Скоростной синтез: автоматизация плавного чтения на повышенной скорости при сохранении 100% понимания."
        - "Детальная визуализация: развитие воображения; умение пересказывать текст ярко и последовательно, опираясь на внутренние образы."
        - "Концентрация внимания: способность удерживать фокус на чтении длинных (для этого возраста) текстов без потери интереса."
      en:
        - "Semantic Projection: The ability to identify the main idea in a paragraph and connect parts of the text into a cohesive logical chain."
        - 'Deep Processing: The skill of "thoughtful reading" — the ability to answer complex questions about the text without re-reading.'
        - "Speed Reading Synthesis: Automating fluent reading at an accelerated pace while maintaining 100% comprehension."
        - "Detailed Visualization: Developing imagination; the ability to retell the text vividly and coherently, relying on internal imagery."
        - "Focused Attention: The ability to stay engaged while reading longer texts (appropriate for this age group) without losing interest."
  - id: advanced
    skills:
      ru:
        - "Интеллектуальное лидерство: достижение скорости чтения, значительно превышающей школьные нормы, при 100% усвоении материала."
        - "Навык «Смысловой фильтр»: умение мгновенно находить ключевые факты и отвечать на сложные вопросы по тексту (сканирующее чтение)."
        - "Креативный пересказ: способность воспроизводить текст любой сложности, используя богатый словарный запас и собственные образы."
        - "Высокая нейронная выносливость: способность сохранять концентрацию и интерес при работе с большими объёмами информации."
        - "Читательская автономия: сформированная привычка и личный интерес к самостоятельному чтению без внешнего принуждения."
      en:
        - "Intellectual Leadership: Achieving a reading speed significantly exceeding school standards with 100% material retention."
        - "Semantic Filter Skill: The ability to instantly locate key facts and answer complex questions about the text (scan reading)."
        - "Creative Retelling: The ability to reproduce texts of any complexity using a rich vocabulary and personal imagery."
        - "High Cognitive Endurance: The ability to maintain concentration and interest when working with large volumes of information."
        - "Reading Autonomy: A developed habit and personal interest in independent reading without external pressure."
